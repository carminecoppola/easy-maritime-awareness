# YOLO Training Configuration
# Baseline configuration for training YOLO on EASY-v0

model:
  architecture: "yolov8"
  size: "m"  # nano, small, medium, large, xlarge
  pretrained: true
  pretrained_weights: "yolov8m.pt"

training:
  epochs: 100
  batch_size: 32
  imgsz: 640
  device: 0  # GPU device ID, or "cpu"
  workers: 8
  
  # Learning rate
  lr0: 0.01
  lrf: 0.01
  
  # Optimization
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 3
  warmup_momentum: 0.8
  
  # Augmentation
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  
  # Loss weights
  cls: 0.5
  box: 7.5
  obj: 1.0

dataset:
  path: "data/processed/EASY-v0"
  yaml: "data/processed/EASY-v0/dataset.yaml"

output:
  project: "outputs"
  name: "yolo_baseline"
  save: true
  save_period: 10
  conf_threshold: 0.5
  iou_threshold: 0.6

validation:
  val: true
  split: 0.2

callbacks:
  tensorboard: true
  csv_log: true
