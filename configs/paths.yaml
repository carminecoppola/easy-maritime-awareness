# EASY path configuration
# Source of truth for storage layout and path resolution used by the
# EASY-v0 dataset preparation pipeline.

project:
  name: EASY
  repository_name: easy-maritime-awareness
  version: 0.1.0

storage:
  env_var: EASY_DATA_ROOT
  username_env_vars:
    - USER
    - LOGNAME
  username: null
  fallback_root_template: null

  root: data
  raw: "{root}/raw"
  interim: "{root}/interim"
  processed: "{root}/processed"
  logs: "{root}/logs"
  manifests: "{root}/manifests"
  easy_v0: "{processed}/EASY-v0"

  sources:
    smd: "{raw}/smd"
    seaships: "{raw}/seaships"
    massmind: "{raw}/massmind"
  source_layout:
    images_subdir: images
    annotations_subdir: annotations

logging:
  level: INFO
  report_name: easy_v0_build_report.md
  manifest_name: easy_v0_build_manifest.json
  dataset_manifest_name: dataset_manifest.json
