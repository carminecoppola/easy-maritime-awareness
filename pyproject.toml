[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-maritime-awareness"
version = "0.1.0"
description = "EASY dataset-core repository for maritime dataset staging and YOLO export"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "EASY Team"}]
keywords = ["maritime", "dataset", "object-detection", "yolo", "staging"]

dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "opencv-python>=4.7.0",
    "Pillow>=9.5.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
