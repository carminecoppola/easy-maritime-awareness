[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-maritime-awareness"
version = "1.0.0"
description = "EASY maritime object-detection models, sequence-safe dataset tooling and validation scripts"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "BSD-3-Clause"}
authors = [{name = "Carmine Coppola"}]
keywords = ["maritime", "dataset", "object-detection", "yolo", "edge-computing"]
classifiers = [
    "License :: OSI Approved :: BSD License",
]

dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "opencv-python>=4.7.0",
    "Pillow>=9.5.0",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/carminecoppola/easy-maritime-awareness"
Dashboard = "https://github.com/carminecoppola/EASY-Maritime-Awareness-Dashboard"

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
]

[tool.setuptools]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
