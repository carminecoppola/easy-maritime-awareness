[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-maritime-awareness"
version = "0.1.0"
description = "Easy Maritime Awareness - Computer Vision for maritime object detection and segmentation"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "EASY Team"}
]
keywords = [
    "computer-vision",
    "maritime",
    "object-detection",
    "segmentation",
    "yolo",
    "edge-deployment"
]

dependencies = [
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "opencv-python>=4.7.0",
    "Pillow>=9.5.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "ultralytics>=8.0.0",
    "matplotlib>=3.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "loguru>=0.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "black>=23.3.0",
    "flake8>=6.0.0",
    "isort>=5.12.0"
]
jupyter = [
    "jupyter>=1.0.0",
    "jupyterlab>=3.6.0",
    "ipykernel>=6.20.0"
]
visualization = [
    "seaborn>=0.12.0",
    "plotly>=5.13.0"
]
edge = [
    "tensorflow-lite>=2.12.0"
]

[project.urls]
Homepage = "https://github.com/username/easy-maritime-awareness"
Documentation = "https://github.com/username/easy-maritime-awareness/docs"
Repository = "https://github.com/username/easy-maritime-awareness"

[tool.setuptools]
packages = ["src"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
